<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiza+ | Gerenciador de tarefas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <a class="brand" href="#" aria-label="Organiza+">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M6.5 12.5 10 16l7.5-8"></path></svg>
            </span>
            <span>Organiza<span>+</span></span>
        </a>

        <nav class="sidebar-nav" id="nav" aria-label="Navegação principal">
            <p class="nav-title">Tarefas</p>
            <a class="nav-item active" href="#" data-filtro="todas"><span>Todas</span><strong id="c-todas">0</strong></a>
            <a class="nav-item" href="#" data-filtro="hoje"><span>Hoje</span><strong id="c-hoje">0</strong></a>
            <a class="nav-item" href="#" data-filtro="semana"><span>Próximos 7 dias</span><strong id="c-semana">0</strong></a>

            <p class="nav-title section-title">Listas</p>
            <div id="nav-listas"></div>
        </nav>

        <div class="sidebar-footer">
            <button class="sidebar-action" type="button" id="btn-nova-lista">
                <span aria-hidden="true">＋</span> Nova lista
            </button>
            <div class="user-mini">
                <span class="avatar avatar-small">AS</span>
                <span><strong>Ana Souza</strong><small>Minha conta</small></span>
                <span class="more" aria-hidden="true">•••</span>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-spacer"></div>
            <button class="avatar avatar-user" type="button" aria-label="Perfil">AS</button>
        </header>

        <section class="content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow" id="data-hoje"></p>
                    <h1 id="titulo-pagina">Todas</h1>
                </div>
                <button class="primary-button" type="button" id="btn-nova-tarefa"><span>＋</span> Nova tarefa</button>
            </div>

            <form class="task-quick-add" id="form-rapido" aria-label="Adicionar tarefa">
                <span class="plus-icon" aria-hidden="true">＋</span>
                <input type="text" id="input-titulo" placeholder="Crie uma nova tarefa..." aria-label="Nome da nova tarefa" required>
                <select id="select-lista" aria-label="Lista"></select>
                <input type="date" id="input-data" aria-label="Data de entrega">
                <button type="submit">Adicionar</button>
            </form>

            <section class="board" aria-label="Quadro de tarefas">
                <article class="task-column" data-status="A_FAZER">
                    <header class="column-header">
                        <div><span class="column-indicator todo"></span><h2>A Fazer</h2><span class="task-count" id="n-A_FAZER">0</span></div>
                        <button class="add-task" type="button" data-add="A_FAZER" aria-label="Adicionar em A Fazer">＋</button>
                    </header>
                    <div class="task-list" id="col-A_FAZER"></div>
                    <button class="column-add" type="button" data-add="A_FAZER">＋ Adicionar tarefa</button>
                </article>

                <article class="task-column" data-status="FAZENDO">
                    <header class="column-header">
                        <div><span class="column-indicator doing"></span><h2>Fazendo</h2><span class="task-count" id="n-FAZENDO">0</span></div>
                        <button class="add-task" type="button" data-add="FAZENDO" aria-label="Adicionar em Fazendo">＋</button>
                    </header>
                    <div class="task-list" id="col-FAZENDO"></div>
                    <button class="column-add" type="button" data-add="FAZENDO">＋ Adicionar tarefa</button>
                </article>

                <article class="task-column completed-column" data-status="CONCLUIDA">
                    <header class="column-header">
                        <div><span class="column-indicator done"></span><h2>Concluídas</h2><span class="task-count" id="n-CONCLUIDA">0</span></div>
                        <button class="add-task" type="button" data-add="CONCLUIDA" aria-label="Adicionar em Concluídas">＋</button>
                    </header>
                    <div class="task-list" id="col-CONCLUIDA"></div>
                    <button class="column-add" type="button" data-add="CONCLUIDA">＋ Adicionar tarefa</button>
                </article>
            </section>
        </section>
    </main>
</div>
<script src="app.js"></script>
</body>
</html>
